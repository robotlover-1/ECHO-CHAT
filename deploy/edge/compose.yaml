# 公网入口节点：frps + nginx。运行目录=deploy/edge（compose 自动读同目录 .env）。
# 7500 dashboard 已关闭；39001/7500 均不对外。
name: answermesh-edge

services:
  frps:
    image: ${FRPS_IMAGE:-snowdreamtech/frps:0.62.1}
    restart: unless-stopped
    command: ["-c", "/app/config.yaml"]
    volumes:
      - ./tunnel/frps.yaml:/app/config.yaml:ro
    ports:
      - "${FRP_BIND_PORT:-39000}:${FRP_BIND_PORT:-39000}"
      - "127.0.0.1:${FRP_VHOST_HTTP_PORT:-39001}:${FRP_VHOST_HTTP_PORT:-39001}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/answermesh.conf:/etc/nginx/conf.d/answermesh.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - frps
